<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin the Wheel</title>

<style>
  /* ============ LOOK & FEEL (CSS) ============ */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    background: #fff8f5;               /* page background */
    font-family: "Trebuchet MS", sans-serif;
    overflow: hidden;
  }

  /* ---- Wheel ---- */
  .wheel-area {
    position: relative;
    width: min(80vw, 380px);
    height: min(80vw, 380px);
  }
  #wheel {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 8px solid #ffffff;          /* white rim */
    box-shadow: 0 6px 24px rgba(240, 170, 190, 0.35);
    box-sizing: border-box;
  }

  /* little flowers placed on each division (made by the script) */
  .petal-mark {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    color: rgba(255, 255, 255, 0.9);    /* flower line colour */
  }

  /* centre button circle */
  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 64px;
    height: 64px;
    margin: -32px 0 0 -32px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 2px 10px rgba(240, 170, 190, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f4a9bd;
  }

  /* pointer at the top */
  .pointer {
    position: absolute;
    top: -14px;
    left: 50%;
    margin-left: -16px;
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 30px solid #f4a9bd;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.12));
    z-index: 2;
  }

  /* ---- Spin button ---- */
  #spinBtn {
    padding: 14px 54px;
    font-size: 18px;
    letter-spacing: 2px;
    color: #ffffff;
    background: #f4a9bd;                /* button colour */
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(244, 169, 189, 0.5);
    transition: transform 0.15s, background 0.2s;
  }
  #spinBtn:hover    { background: #f197b0; transform: translateY(-1px); }
  #spinBtn:disabled { background: #e6cdd4; cursor: default; box-shadow: none; }

  /* ---- Background flower outlines ---- */
  .deco {
    position: fixed;
    color: #f7d6df;                     /* outline colour */
    z-index: -1;
  }
</style>
</head>

<body>

<!-- ============ PAGE CONTENT (HTML) ============ -->

<!-- Flower drawing, defined once and reused everywhere below -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="flower" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <ellipse cx="50" cy="25" rx="11" ry="19"/>
      <ellipse cx="50" cy="25" rx="11" ry="19" transform="rotate(72 50 50)"/>
      <ellipse cx="50" cy="25" rx="11" ry="19" transform="rotate(144 50 50)"/>
      <ellipse cx="50" cy="25" rx="11" ry="19" transform="rotate(216 50 50)"/>
      <ellipse cx="50" cy="25" rx="11" ry="19" transform="rotate(288 50 50)"/>
      <circle cx="50" cy="50" r="6"/>
    </g>
  </symbol>
</svg>

<!-- Background flowers (change position/size here if you like) -->
<svg class="deco" style="top:4%;  left:5%;  width:120px; transform:rotate(15deg)"><use href="#flower"/></svg>
<svg class="deco" style="top:10%; right:6%; width:80px;  transform:rotate(-20deg)"><use href="#flower"/></svg>
<svg class="deco" style="bottom:6%; left:8%;  width:90px;  transform:rotate(40deg)"><use href="#flower"/></svg>
<svg class="deco" style="bottom:4%; right:5%; width:130px; transform:rotate(-10deg)"><use href="#flower"/></svg>

<div class="wheel-area">
  <div class="pointer"></div>
  <div id="wheel"></div>
  <div class="hub">
    <svg width="40" height="40"><use href="#flower"/></svg>
  </div>
</div>

<button id="spinBtn">SPIN</button>


<script>
  /* ====================================================
     EDIT HERE  -  the only part you need to change
     ==================================================== */

  // 1) Number of divisions on the wheel
  const DIVISIONS = 4;

  // 2) Colours of the divisions (any CSS colour: names, #hex, rgb)
  //    If you have more divisions than colours, the list repeats.
  const COLORS = [
    "#ffd1dc",   // pastel pink
    "#d4f0e4",   // pastel mint
    "#fff2b8",   // pastel yellow
    "#d9ccf5"    // pastel lavender
  ];

  // 3) Number of full turns each spin makes
  const SPINS = 5;

  // (optional) How many seconds a spin lasts
  const SPIN_SECONDS = 5;

  /* ====================================================
     END OF EDIT AREA - the code below makes it work
     ==================================================== */

  const wheel = document.getElementById("wheel");
  const button = document.getElementById("spinBtn");
  const sliceAngle = 360 / DIVISIONS;

  // Paint the divisions
  let stops = [];
  for (let i = 0; i < DIVISIONS; i++) {
    const colour = COLORS[i % COLORS.length];
    stops.push(colour + " " + (i * sliceAngle) + "deg " + ((i + 1) * sliceAngle) + "deg");
  }
  wheel.style.background = "conic-gradient(" + stops.join(", ") + ")";

  // Put a small flower in the middle of each division
  for (let i = 0; i < DIVISIONS; i++) {
    const middle = i * sliceAngle + sliceAngle / 2;
    const mark = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    mark.setAttribute("class", "petal-mark");
    mark.innerHTML = '<use href="#flower"/>';
    mark.style.transform = "rotate(" + middle + "deg) translateY(-105px)";
    wheel.appendChild(mark);
  }

  // Spin
  let rotation = 0;
  button.addEventListener("click", function () {
    button.disabled = true;
    rotation += SPINS * 360 + Math.random() * 360;
    wheel.style.transition = "transform " + SPIN_SECONDS + "s cubic-bezier(0.15, 0.7, 0.2, 1)";
    wheel.style.transform = "rotate(" + rotation + "deg)";
  });
  wheel.addEventListener("transitionend", function () {
    button.disabled = false;
  });
</script>

</body>
</html>
